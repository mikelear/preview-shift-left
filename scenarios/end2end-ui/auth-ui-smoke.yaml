#   02-login-form          — PASS (Tier A)
#   03-login-flow          — PASS (Tier B: GET /callback -> authenticated.html)
#   05-sign-out            — PASS (Tier B: /logout serves index.html)
#   06-two-factor-setup    — PASS (Tier B: /two-factor-settings serves 2FA page)
#
#   04-token-renewal       — SKIPPED (requires real Hydra admin API to revoke
#                            a session; that's tier 3 territory — deploy Hydra
