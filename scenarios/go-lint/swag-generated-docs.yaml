# Scenario: go-lint catalog task tolerates swag-generated docs/docs.go.
#
# Auth-service (PR #16, 2026-04-27) was the first consumer to commit
# docs/docs.go from `swag init` and hit gocritic codegenComment because
# swag emits "GENERATED BY SWAG; DO NOT EDIT" which doesn't match the
# strict "Code generated .* DO NOT EDIT." regex. Fix landed in catalog
# go/.golangci.base.yml as `exclusions.generated: lax`.
#
# This scenario locks in the fix: a minimal Go module + a swag-style
# docs/docs.go must lint cleanly. Future regressions to the base config
# get caught locally in seconds.

kind: task-test
name: go-lint-swag-generated
task: ../../../leartech-pipeline-catalog/tasks/go-lint/pullrequest.yaml

env:
  APP_NAME: go-lint-scenario
  PULL_NUMBER: "1"
  REPO_OWNER: mikelear
  REPO_NAME: go-lint-scenario
  CLUSTER_ID: local

fixtures:
  go.mod: |
    module local/go-lint-scenario

    go 1.25
  main.go: |
    // Package main is a trivial entrypoint used by the harness scenario.
    package main

    func main() {}
  # Mimic the swag-generated header verbatim. With `generated: lax` in
  # the catalog base config, gocritic's codegenComment rule should skip
  # this file. Without the fix it errors with:
  #   docs/docs.go:2:1: codegenComment: comment should match `Code
  #   generated .* DO NOT EDIT.` regexp (gocritic)
  docs/docs.go: |
    // Package docs GENERATED BY SWAG; DO NOT EDIT
    // This file was generated by swaggo/swag
    package docs
  # Per-repo override file — typical leartech consumer shape. The
  # catalog's go-lint task yq-merges base ← local, so this exercises
  # the merge path too.
  .golangci.yml: |
    version: "2"
    formatters:
      settings:
        goimports:
          local-prefixes: local/go-lint-scenario

expect:
  taskrun_status: Succeeded
  stdout_contains:
    - "==> golangci-lint run -v"
    - "==> lint complete"
