# Scenario: end2end gate-check reports ready on first probe.
#
# Exercises the preview-gate branch of
# leartech-pipeline-catalog/tasks/end2end/pullrequest.yaml: gate returns
# 200 immediately, task invokes the consumer's end2end/run.sh, sees a
# valid results.json, exits PASS.
#
# Repo-agnostic — works against any consumer that ships an end2end/run.sh:
#   make test SCENARIO=scenarios/end2end/gate-ready.yaml                    # default fixtures
#   make test SCENARIO=scenarios/end2end/gate-ready.yaml REPO=../leartech-auth-ui
#   make test SCENARIO=scenarios/end2end/gate-ready.yaml APP_NAME=foo PULL_NUMBER=99
#
# Runner expands ${VAR} from environment; REPO=<path> auto-derives
# APP_NAME from basename. fixtures.from_repo pulls files from the
# consumer's actual repo when REPO is set, otherwise falls back to inline.
#
# GIT_TOKEN is empty so the sticky-comment GitHub POST path skips —
# covering it would require a TLS-capable api.github.com stub (open work).

kind: task-test
name: gate-ready
task: ../../../leartech-pipeline-catalog/tasks/end2end/pullrequest.yaml

env:
  APP_NAME: ${APP_NAME}
  PULL_NUMBER: ${PULL_NUMBER}
  REPO_OWNER: ${REPO_OWNER}
  REPO_NAME: ${REPO_NAME}
  CLUSTER_ID: ${CLUSTER_ID}
  GIT_TOKEN: ${GIT_TOKEN}
  DOMAIN: ${DOMAIN}

fixtures:
  # .jx/variables.sh would be produced by `jx gitops variables` on the
  # cluster; locally we synthesise it from the same env vars the cluster
  # would have populated.
  .jx/variables.sh:
    template: |
      export APP_NAME=${APP_NAME}
      export PULL_NUMBER=${PULL_NUMBER}
      export REPO_OWNER=${REPO_OWNER}
      export REPO_NAME=${REPO_NAME}
      export VERSION=${VERSION}
      export DOMAIN=${DOMAIN}

  # When REPO is set, run the consumer's REAL end2end/run.sh — same
  # script the cluster catalog task invokes. Otherwise inline a minimal
  # always-passing fallback so the scenario remains runnable standalone
  # (for first-run smoke-testing the harness itself).
  end2end/run.sh:
    from_repo: end2end/run.sh
    fallback: |
      #!/usr/bin/env bash
      mkdir -p end2end
      cat > end2end/results.json <<'JSON'
      {
        "success": true,
        "summary": "1/1 checks passed",
        "tests": [
          { "name": "smoke", "status": "pass", "duration_ms": 42, "message": "ok" }
        ],
        "metadata": { "preview_url": "stub", "version": "${VERSION}" }
      }
      JSON

stubs:
  - name: preview-gate
    port: 8090
    responses:
      - method: GET
        path: /cgi-bin/gate
        status: 200
        body: '{"ready":true,"deployments":["preview"],"version":"${VERSION}"}'

expect:
  taskrun_status: Succeeded
  stdout_contains:
    - "preview-gate detected"
    - "gate reports READY"
    - "preview stable; invoking end2end/run.sh"
    - "PASS: end2end complete"
