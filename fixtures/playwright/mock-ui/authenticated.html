<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Authenticated (mock)</title>

<body>

      <h1>Authenticated</h1>

           JWT is issued. -->
      <section>
        <h2>Token</h2>
        <pre>{
  "iss": "https://hydra-pr42.localtest.me",
  "sub": "test@leartech.com",
  "aud": "frontend-services",
  "exp": 9999999999
}</pre>
      </section>
      <form action="/logout" method="get">
        <button type="submit">Sign Out</button>
      </form>
    </main>
  </app-root>
</body>
</html>
