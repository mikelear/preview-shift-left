server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Tier B routes — explicit path-to-file mapping for the login flow.
  # Stateless: /callback always serves authenticated, /two-factor-settings
  # always serves 2FA page. Real auth is out of scope for the mock.
  location = /callback {
    try_files /authenticated.html =500;
  }
  location = /two-factor-settings {
    try_files /two-factor.html =500;
  }
  location = /logout {
    # Serve login page directly — avoids relative-Location redirect edge
    # cases in Chromium. The intent is the same: after sign-out, the user
    # sees the login form.
    try_files /index.html =500;
  }

  # SPA-style routing: anything else falls back to index.html so / and
  # /login both render the login form — same shape as the real auth-ui.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
